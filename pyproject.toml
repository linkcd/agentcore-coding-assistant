[project]
name = "herdr-agentcore-workspace"
version = "0.1.0"
description = "Workspace for independent AgentCore runtimes, a Herdr connector, and their contract"
requires-python = ">=3.11"
dependencies = ["herdr-agentcore==0.1.0"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/herdr_plugin", "src/runtime_contract"]

[tool.uv.sources]
herdr-agentcore = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["src/runtime_contract/tests", "src/herdr_plugin/tests", "src/agentcore_runtime/tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
