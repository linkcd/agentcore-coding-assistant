[project]
name = "agentcore-coding-runtimes"
version = "0.1.0"
description = "Independent AgentCore coding runtime images, CDK deployment, and verification"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "bedrock-agentcore==1.24.1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
  "jsonschema>=4.23,<5",
]

[tool.pytest.ini_options]
testpaths = ["src/agentcore_runtime/tests"]
asyncio_mode = "auto"
pythonpath = ["src", "src/agentcore_runtime/tests", "scripts"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
