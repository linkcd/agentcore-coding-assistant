[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "herdr-agentcore"
version = "0.1.0"
description = "A community Herdr plugin for OpenCode on Amazon Bedrock AgentCore Runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "bedrock-agentcore==1.24.1",
    "websockets>=15.0.1,<16",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]

[project.scripts]
herdr-agentcore = "herdr_agentcore.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/herdr_agentcore"]

[tool.hatch.build.targets.sdist]
include = ["src/", "herdr-plugin.toml", "pyproject.toml", "uv.lock", "README.md", "REQUIREMENTS.md", "DESIGN.md", "agent.md", "AGENTS.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
