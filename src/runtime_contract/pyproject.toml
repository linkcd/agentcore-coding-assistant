[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentcore-contract"
version = "0.1.0"
description = "Versioned connection contract for AgentCore terminal runtimes"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# Shared root legal files are included explicitly below.
license-files = []
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["agentcore_contract"]

[tool.hatch.build.targets.wheel.extra-metadata]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
# Standalone source distributions contain their own root copies.
"LICENSE" = "LICENSE"
"NOTICE" = "NOTICE"

[tool.hatch.build.targets.sdist]
include = ["agentcore_contract/", "connection.ts", "tests/", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
