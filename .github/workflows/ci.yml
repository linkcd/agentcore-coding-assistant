name: Runtime checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      - run: npm ci --prefix src/agentcore_runtime/cdk
      - run: npm ci --prefix src/ec2_herdr_host
      - run: uv run --frozen ruff check src scripts
      - run: uv run --frozen ruff format --check src scripts
      - run: uv run --frozen pytest -q --tb=short
      - run: npm run check --prefix src/agentcore_runtime/cdk
      - run: npm test --prefix src/agentcore_runtime/cdk
      - run: npm run check --prefix src/ec2_herdr_host
      - run: npm test --prefix src/ec2_herdr_host
      - run: uv run --frozen python scripts/check_repository.py
      - run: uv run --frozen python scripts/repository_privacy.py
      - name: Verify runtime SDK installation
        run: .venv/bin/python -c "import boto3; from bedrock_agentcore.runtime import AgentCoreRuntimeClient"
