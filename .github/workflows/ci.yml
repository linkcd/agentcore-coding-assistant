name: Plugin checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run ruff check src
      - run: uv run ruff format --check src
      - run: uv run pytest
      - run: uv build
      - name: Check production installation
        run: |
          uv sync --frozen --no-dev
          .venv/bin/python -m herdr_agentcore --help
